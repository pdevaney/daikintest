<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Results</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg:#f6f6f6; --card:#fff; --border:#ddd; --muted:#666; --primary:#005eb8; --danger:#b00020; --success:#19713c; --shadow:0 6px 18px rgba(0,0,0,.06); }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:#222; }
    .page { max-width:1220px; margin:0 auto; }
    .header { margin-bottom:18px; }
    h1 { margin:0 0 5px; font-size:26px; }
    .subtitle { margin:0; color:var(--muted); }
    .header-row { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
    .pillar-control { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
    .pillar-control label { color:var(--muted); font-size:14px; font-weight:650; }
    .pillar-select { min-width:120px; padding:8px 34px 8px 11px; border:1px solid var(--border); border-radius:7px; background:#fff; color:#222; font:inherit; font-size:14px; }
    .pillar-select:disabled { opacity:.65; cursor:wait; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); }
    .state { padding:28px; text-align:center; }
    .error { color:var(--danger); background:#fff5f5; border-color:#efc2c2; }
    .hidden { display:none !important; }
    .exam-summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
    .exam-summary-card { padding:18px 20px; }
    .exam-summary-label { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; }
    .exam-summary-title { margin:0 0 14px; font-size:18px; line-height:1.35; }
    .exam-summary-details { display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:14px; }
    .exam-summary-details .value { font-weight:650; }
    .exam-empty { color:var(--muted); font-size:14px; }
    .results-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr); gap:20px; align-items:start; }
    .chart-card { padding:20px; }
    .card-title { margin:0 0 4px; font-size:20px; }
    .card-description { margin:0 0 18px; color:var(--muted); font-size:14px; }
    .chart-wrapper { position:relative; width:100%; height:620px; }
    .category-scroll { max-height:710px; overflow-y:auto; padding-right:6px; scrollbar-gutter:stable; }
    .category-column { display:grid; gap:12px; }
    .category-card { padding:16px 18px; }
    .category-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .category-name { font-weight:700; font-size:15px; line-height:1.3; }
    .category-score { font-size:25px; font-weight:750; white-space:nowrap; }
    .category-details { display:grid; grid-template-columns:1fr auto; gap:7px 12px; font-size:13px; }
    .label { color:var(--muted); }
    .pass { color:var(--success); font-weight:700; }
    .fail { color:var(--danger); font-weight:700; }
    @media (max-width:900px) {
      body{padding:14px;}
      .header-row{align-items:flex-start;flex-direction:column;}
      .exam-summary-grid{grid-template-columns:1fr;}
      .results-grid{grid-template-columns:1fr;}
      .chart-wrapper{height:520px;}
      .category-scroll{max-height:520px;}
    }
    @media (max-width:520px) { .chart-wrapper{height:430px;} }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>Exam Results</h1>
          <p id="pageSubtitle" class="subtitle">Loading your assessment profile...</p>
        </div>
        <div id="pillarControl" class="pillar-control hidden">
          <label for="pillarSelect">Pillar</label>
          <select id="pillarSelect" class="pillar-select" aria-label="Select pillar"></select>
        </div>
      </div>
    </header>

    <section id="loadingPanel" class="panel state">Loading your exam results...</section>
    <section id="errorPanel" class="panel state error hidden"><strong>Unable to load your exam results.</strong><div id="errorMessage" style="margin-top:8px"></div></section>
    <section id="emptyPanel" class="panel state hidden"><strong>No exam results are available yet.</strong><div id="emptyMessage" style="margin-top:8px;color:#666"></div></section>

    <section id="resultsPanel" class="hidden">
      <div class="exam-summary-grid">
        <article id="currentExamCard" class="panel exam-summary-card"></article>
        <article id="previousExamCard" class="panel exam-summary-card"></article>
      </div>
      <div class="results-grid">
        <article class="panel chart-card">
          <h2 class="card-title">Category profile</h2>
          <p id="chartDescription" class="card-description">Your latest result in each category. Pass marks are shown where a result exists.</p>
          <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
        </article>
        <aside class="category-scroll" aria-label="Category results">
          <div id="categoryCards" class="category-column"></div>
        </aside>
      </div>
    </section>
  </main>

<script>
  // Replace these with the endpoint/token for the tested radar API.
  const API_URL = "https://apim.workato.com/213564_daikinj/exam_management-v10/exams/radar";
  const API_TOKEN = "9f98ef3719fa6645943f8056f2b3a2c4dd8e7f20c92ccb83babfcd74a029104f";
  const FORM_TYPE = "exam_admin";
  const FORM_SUBTYPE = "exams/radar";

  let radarChart = null;
  let iframeParameters = null;
  let selectedPillar = "";

  document.addEventListener("DOMContentLoaded", initialisePage);

  async function initialisePage() {
    try {
      validateConfiguration();
      iframeParameters = getIframeParameters();
      validateAuthenticationParameters(iframeParameters);
      document.getElementById("pillarSelect").addEventListener("change", handlePillarChange);
      await loadResults("");
    } catch (error) {
      console.error("Unable to display radar chart:", error);
      showError(error.message);
    }
  }

  async function handlePillarChange(event) {
    const pillar = normaliseText(event.target.value);
    if (!pillar || pillar === selectedPillar) return;
    await loadResults(pillar);
  }

  async function loadResults(pillar) {
    setPillarLoading(true);
    if (!document.getElementById("resultsPanel").classList.contains("hidden")) {
      document.getElementById("pageSubtitle").textContent = "Loading assessment profile...";
    } else {
      showLoading();
    }

    try {
      const body = await retrieveExamResults(iframeParameters, pillar);
      handleApiResult(body);
    } catch (error) {
      console.error("Unable to display radar chart:", error);
      showError(error.message);
    } finally {
      setPillarLoading(false);
    }
  }

  function validateConfiguration() {
    if (!API_URL || API_URL === "YOUR_WORKATO_API_ENDPOINT") throw new Error("The Workato API URL has not been configured.");
    if (!API_TOKEN || API_TOKEN === "YOUR_WORKATO_API_TOKEN") throw new Error("The Workato API token has not been configured.");
  }

  function getIframeParameters() {
    const p = new URLSearchParams(window.location.search);
    return {
      user_id: p.get("user_id") || "",
      username: p.get("username") || "",
      auth_code: p.get("auth_code") || "",
      hash: p.get("hash") || "",
      iframe_src: p.get("iframe_src") || window.location.href
    };
  }

  function validateAuthenticationParameters(parameters) {
    const missing = ["user_id","username","auth_code","hash"].filter(name => !parameters[name]);
    if (missing.length) throw new Error("Missing authentication parameters: " + missing.join(", "));
  }

  async function retrieveExamResults(iframeParameters, pillar) {
    const requestPayload = {
      form_type: FORM_TYPE,
      form_subtype: FORM_SUBTYPE,
      pillar: normaliseText(pillar),
      iframe_params: iframeParameters
    };

    let response;
    try {
      response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "Accept":"application/json", "Api-token":API_TOKEN },
        body: JSON.stringify(requestPayload)
      });
    } catch (e) {
      throw new Error("The browser was unable to contact the exam results service.");
    }

    const text = await response.text();
    let body = null;
    if (text) {
      try { body = JSON.parse(text); }
      catch (e) { throw new Error(`The API returned HTTP ${response.status}, but its response was not valid JSON.`); }
    }

    if (!response.ok) {
      const result = extractResultObject(body);
      if (result && result.message) {
        const error = new Error(result.message);
        error.applicationStatus = Number(result.status);
        error.httpStatus = response.status;
        throw error;
      }
      throw new Error(`The API request failed with HTTP status ${response.status}.`);
    }

    if (!body) throw new Error("The Workato API returned an empty response.");
    return body;
  }

  function extractResultObject(body) {
    if (body && body.result && typeof body.result === "object") return body.result;
    if (body && body.response && body.response.result && typeof body.response.result === "object") return body.response.result;
    if (body && body.response && body.response.status !== undefined && Array.isArray(body.response.categories)) return body.response;
    return null;
  }

  function handleApiResult(body) {
    const result = extractResultObject(body);
    if (!result) throw new Error("The API response did not contain the expected result object.");

    const status = Number(result.status);
    if (status !== 0) throw new Error(result.message || "Unable to retrieve exam results.");

    const categories = Array.isArray(result.categories) ? result.categories : [];
    const pillarCategories = Array.isArray(result.pillar_categories) ? result.pillar_categories : [];
    const pillars = Array.isArray(result.pillars) ? result.pillars : [];

    selectedPillar = normaliseText(result.pillar);
    renderPillarSelector(pillars, selectedPillar);

    if (!pillarCategories.length) {
      showEmpty("No categories are configured for this pillar.");
      return;
    }

    const radarCategories = buildRadarCategories(pillarCategories, categories);
    renderResults(result, radarCategories, categories);
  }

  function buildRadarCategories(pillarCategories, resultCategories) {
    const resultByCode = new Map();
    resultCategories.forEach(category => {
      const code = normaliseText(category.code);
      if (code) resultByCode.set(code, category);
    });

    // Preserve the order supplied by the API. sort_order is local to each template/level.
    return pillarCategories.map(category => {
      const code = normaliseText(category.code);
      const result = resultByCode.get(code);
      return {
        code,
        name: normaliseText(category.name) || normaliseText(result && result.name) || "Category",
        score: result && hasNumericValue(result.score) ? Number(result.score) : 0,
        pass_mark: result && hasNumericValue(result.pass_mark) ? Number(result.pass_mark) : null,
        attempted: Boolean(result)
      };
    });
  }

  function renderPillarSelector(pillars, currentPillar) {
    const control = document.getElementById("pillarControl");
    const select = document.getElementById("pillarSelect");
    select.innerHTML = "";

    pillars.forEach(pillar => {
      const name = normaliseText(pillar.name);
      if (!name) return;
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      option.selected = name === currentPillar;
      select.appendChild(option);
    });

    if (currentPillar && !Array.from(select.options).some(option => option.value === currentPillar)) {
      const option = document.createElement("option");
      option.value = currentPillar;
      option.textContent = currentPillar;
      option.selected = true;
      select.appendChild(option);
    }

    control.classList.toggle("hidden", select.options.length === 0);
  }

  function renderResults(result, radarCategories, resultCategories) {
    document.getElementById("pageSubtitle").textContent = result.pillar ? `Assessment performance — Pillar ${result.pillar}` : "Assessment performance by category";
    renderExamSummary("currentExamCard", "Current exam", result.current_exam);
    renderExamSummary("previousExamCard", "Previous exam", result.previous_exam);
    renderRadarChart(radarCategories);
    renderCategoryCards(resultCategories);
    showResults();
  }

  function renderExamSummary(elementId, label, exam) {
    const container = document.getElementById(elementId);
    container.innerHTML = "";

    const labelEl = document.createElement("div");
    labelEl.className = "exam-summary-label";
    labelEl.textContent = label;
    container.appendChild(labelEl);

    if (!exam || typeof exam !== "object" || !normaliseText(exam.exam_id)) {
      const empty = document.createElement("div");
      empty.className = "exam-empty";
      empty.textContent = label === "Previous exam" ? "No previous exam" : "No exams completed in this pillar";
      container.appendChild(empty);
      return;
    }

    const title = document.createElement("h2");
    title.className = "exam-summary-title";
    title.textContent = normaliseText(exam.exam_title) || normaliseText(exam.exam_id);
    container.appendChild(title);

    const details = document.createElement("div");
    details.className = "exam-summary-details";
    addExamDetail(details, "Exam", normaliseText(exam.exam_id) || "—");
    addExamDetail(details, "Level", normaliseText(exam.level) || "—");
    addExamDetail(details, "Completed", formatDate(exam.taken_at));
    addExamDetail(details, "Overall score", hasNumericValue(exam.overall_score) ? `${Number(exam.overall_score)}%` : "—");
    container.appendChild(details);
  }

  function addExamDetail(container, label, value) {
    container.append(makeCell(label, "label"), makeCell(value, "value"));
  }

  function formatDate(value) {
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return normaliseText(value) || "—";
    return new Intl.DateTimeFormat("en-NZ", { day:"numeric", month:"short", year:"numeric" }).format(date);
  }

  function renderRadarChart(categories) {
    const labels = categories.map(c => normaliseText(c.name) || "Category");
    const scores = categories.map(c => toChartNumber(c.score) ?? 0);
    const passMarks = categories.map(c => c.attempted ? toChartNumber(c.pass_mark) : null);
    const hasPassMarks = passMarks.some(value => value !== null);

    const datasets = [{
      label: "Score",
      data: scores,
      borderColor: "rgba(0, 94, 184, 1)",
      backgroundColor: "rgba(0, 94, 184, 0.18)",
      pointBackgroundColor: "rgba(0, 94, 184, 1)",
      pointBorderColor: "#fff",
      borderWidth: 2,
      pointRadius: 4,
      fill: true
    }];

    if (hasPassMarks) {
      datasets.push({
        label: "Pass mark",
        data: passMarks,
        borderColor: "rgba(90, 90, 90, 0.9)",
        backgroundColor: "rgba(90, 90, 90, 0.03)",
        pointBackgroundColor: "rgba(90, 90, 90, 0.9)",
        borderWidth: 2,
        borderDash: [6, 5],
        pointRadius: 2,
        fill: false,
        spanGaps: false
      });
    }

    const canvas = document.getElementById("radarChart");
    if (radarChart) radarChart.destroy();

    radarChart = new Chart(canvas.getContext("2d"), {
      type: "radar",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0,
            max: 100,
            beginAtZero: true,
            ticks: { stepSize:20, backdropColor:"transparent", callback:value => `${value}%` },
            pointLabels: { font:{ size:12 } }
          }
        },
        plugins: {
          legend: { position:"bottom", labels:{ usePointStyle:true, padding:18 } },
          tooltip: {
            callbacks: {
              label: ctx => ctx.raw == null ? `${ctx.dataset.label}: No result` : `${ctx.dataset.label}: ${ctx.raw}%`
            }
          }
        }
      }
    });
  }

  function renderCategoryCards(categories) {
    const container = document.getElementById("categoryCards");
    container.innerHTML = "";

    if (!categories.length) {
      const empty = document.createElement("div");
      empty.className = "panel state";
      empty.textContent = "No results yet for this pillar.";
      container.appendChild(empty);
      return;
    }

    categories.forEach(category => {
      const score = hasNumericValue(category.score) ? Number(category.score) : null;
      const passMark = hasNumericValue(category.pass_mark) ? Number(category.pass_mark) : null;
      const passed = score !== null && passMark !== null ? score >= passMark : null;

      const card = document.createElement("article");
      card.className = "panel category-card";

      const heading = document.createElement("div");
      heading.className = "category-heading";

      const titleBox = document.createElement("div");
      const name = document.createElement("div");
      name.className = "category-name";
      name.textContent = normaliseText(category.name) || "Category";
      titleBox.appendChild(name);

      const scoreBox = document.createElement("div");
      scoreBox.className = "category-score";
      scoreBox.textContent = score === null ? "—" : `${Math.round(score)}%`;
      heading.append(titleBox, scoreBox);

      const details = document.createElement("div");
      details.className = "category-details";
      details.append(makeCell("Pass mark", "label"), makeCell(passMark === null ? "—" : `${passMark}%`));
      details.append(makeCell("Result", "label"), makeCell(passed === null ? "—" : (passed ? "Passed" : "Below pass mark"), passed === null ? "" : (passed ? "pass" : "fail")));

      card.append(heading, details);
      container.appendChild(card);
    });
  }

  function makeCell(text, className="") {
    const el = document.createElement("div");
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  function normaliseText(value) { return value == null ? "" : String(value).trim(); }
  function hasNumericValue(value) { return value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value)); }
  function toChartNumber(value) { return hasNumericValue(value) ? Math.max(0, Math.min(100, Number(value))) : null; }

  function setPillarLoading(isLoading) {
    const select = document.getElementById("pillarSelect");
    if (select) select.disabled = isLoading;
  }

  function hideAll() {
    ["loadingPanel","errorPanel","emptyPanel","resultsPanel"].forEach(id => document.getElementById(id).classList.add("hidden"));
  }
  function showLoading() { hideAll(); document.getElementById("loadingPanel").classList.remove("hidden"); }
  function showResults() { hideAll(); document.getElementById("resultsPanel").classList.remove("hidden"); }
  function showError(message) { hideAll(); document.getElementById("errorMessage").textContent = message || "An unexpected error occurred."; document.getElementById("errorPanel").classList.remove("hidden"); }
  function showEmpty(message) { hideAll(); document.getElementById("emptyMessage").textContent = message || "No categories are available."; document.getElementById("emptyPanel").classList.remove("hidden"); }
</script>
</body>
</html>
